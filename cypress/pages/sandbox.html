<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QA mode sandbox</title>
</head>
<body>
  <h1>QA mode test page</h1>
  <p>The tests inject the extension's real capture scripts here.</p>

  <!-- Elements for the steps log (steps-capture.js) -->
  <form id="formDemo" action="javascript:void(0)">
    <input type="email" name="email" placeholder="Email">
    <input type="password" name="password" placeholder="Password">
    <button type="submit" id="btnSubmit">Place order</button>
  </form>
  <button id="btnDemo" class="primary">Buy <span>now</span></button>

  <!-- Elements for the Cypress-selector chain (steps-capture.js): test
       attribute beating an id, text-only identity, and the structural
       fallback for twins nothing else can tell apart. -->
  <button id="btnCy" data-cy="checkout">Checkout</button>
  <button class="ghost">Cancel order</button>
  <div id="list"><button>Same</button><button>Same</button></div>
  <button class="icon" aria-label="Pause timer">⏸ 00:17</button>
  <button data-testid="save">Save draft</button>
  <span role="tab">Details tab</span>
  <my-chip>Ready chip</my-chip>
  <button class="long">Extend the subscription for another whole year</button>
  <button class="quote">5 "Uncle Tom's Cabin" author Harriet Beecher</button>
</body>
</html>
